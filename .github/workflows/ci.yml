name: CI

on:
  push:
    branches: [main, "merge/**", "team/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-anyio

      - name: Run pytest
        run: python -m pytest server/tests/ -v --tb=short

  flutter-tests:
    name: Flutter (dart test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --concurrency=1
